services:
  deeperseeker:
    build: .
    container_name: deeperseeker
    ports:
      - "0.0.0.0:4000:4000"
    environment:
      - HOST=0.0.0.0
      # The :? below aborts `docker compose up` when the password is UNSET —
      # this is enforced by compose at the variable layer, BEFORE the container
      # starts. The image itself does NOT refuse to boot: when run without
      # compose (plain `docker run` / `python app.py`), app.py only logs a
      # warning on loopback and an error on a non-loopback bind, then starts
      # anyway. Set both admin variables yourself in that case. See README
      # "Security defaults".
      - DEEPSEEKER_ADMIN_USER=${DEEPSEEKER_ADMIN_USER:-admin}
      - DEEPSEEKER_ADMIN_PASSWORD=${DEEPSEEKER_ADMIN_PASSWORD:?Set a strong DEEPSEEKER_ADMIN_PASSWORD in .env}
    env_file:
      - path: .env
        required: false
    volumes:
      - deeperseeker_data:/app/data
    shm_size: "1gb"
    restart: unless-stopped

volumes:
  deeperseeker_data:
