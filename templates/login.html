{% extends "base.html" %}
{% block title %}Sign in - DeeperSeeker{% endblock %}
{% block content %}
<style>
  .login-card{background:var(--card,#fff);border-radius:17px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),
      0 0 0 .5px rgba(0,0,0,.12),0 4px 24px rgba(0,0,0,.08);padding:38px 34px;max-width:360px;margin:9vh auto 0}
  @media(prefers-color-scheme:dark){.login-card{box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),
      0 0 0 .5px rgba(0,0,0,.4),0 4px 24px rgba(0,0,0,.35)}}
  .login-card h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px}
  .login-card .hint{color:var(--p2);font-size:13px;margin:0 0 22px}
  .login-card input{width:100%;margin-bottom:14px}
  .login-card button{width:100%;padding:11px;font-size:14px;border-radius:9px}
  .login-card .err{color:#ff3b30;font-size:13px;margin:0 0 14px}
  @media(prefers-color-scheme:dark){.login-card{background:#1f1f1f}}
  @media(prefers-color-scheme:light){.login-card{background:#fff}}
</style>
<div class="login-card">
    <h1>Sign in</h1>
    <p class="hint">DeeperSeeker admin console</p>
    {% if error %}
    <p class="err">{{ error }}</p>
    {% endif %}
    <form method="post" action="/login">
        <input type="text" name="username" placeholder="Username" required autocomplete="username">
        <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
        <button type="submit">Sign in</button>
    </form>
</div>
{% endblock %}
